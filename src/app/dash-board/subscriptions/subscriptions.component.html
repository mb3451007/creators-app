<div class="container py-4">
  <h3 class="mb-4" *ngIf="subscriptions.length > 0">My Subscriptions</h3>
  <div *ngFor="let subscription of subscriptions" class="card mb-3 shadow-sm">
    <div
      class="card-body d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center"
    >
      <div class="mb-2 mb-md-0">
        <h5 class="mb-1">{{ subscription.creator.name }}</h5>
        <p class="mb-1 text-muted">@{{ subscription.creator.username }}</p>
        <span
          class="badge"
          [ngClass]="{
            'bg-success': subscription.status === 'active',
            'bg-danger': subscription.status === 'canceled'
          }"
        >
          {{ subscription.status | titlecase }}
        </span>
      </div>
      <button
        class="btn btn-outline-danger"
        (click)="cancelSubscription(subscription.subscriptionId)"
        *ngIf="subscription.status === 'active'"
      >
        Cancel
      </button>
    </div>
  </div>
  <h3 class="mb-4" *ngIf="subscriptions.length === 0">
    No Subscriptions Found
  </h3>
</div>
